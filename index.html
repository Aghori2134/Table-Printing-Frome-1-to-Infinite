<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>tables</title>
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
				font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			}

			body {
				min-height: 100vh;
				display: flex;
				justify-content: center;
				align-items: center;
				background: linear-gradient(135deg, #0f172a, #1e293b);
				color: #f8fafc;
			}

			.card {
				background: #334155;
				padding: 2.5rem;
				border-radius: 16px;
				box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 1.5rem;
				min-width: 280px;
				border: 1px solid #475569;
			}

			#abc {
				height: 80px;
				width: 100%;
				background: #0f172a;
				border-radius: 8px;
				display: flex;
				justify-content: center;
				align-items: center;
				font-size: 2.5rem;
				font-weight: 700;
				color: #38bdf8;
				border: 1px solid #1e293b;
			}

			button {
				width: 100%;
				padding: 0.8rem 1.5rem;
				font-size: 1.1rem;
				font-weight: 600;
				text-transform: uppercase;
				letter-spacing: 0.05em;
				color: #ffffff;
				background-color: #0284c7;
				border: none;
				border-radius: 8px;
				cursor: pointer;
				transition: background-color 0.2s ease, transform 0.1s ease;
			}

			button:hover {
				background-color: #0369a1;
			}

			button:active {
				transform: scale(0.98);
			}
		</style>
	</head>
	<body>
		<div class="card">
			<p id="abc" style="height:30px; width:40px;">0</p>
			<button onclick="table()">
				print
			</button>
		</div>

		<script>
			let a=1;
			let b=1;
			
				function table(){	
					document.getElementById('abc').innerHTML=a*b;
					b++;
					
					if (b>10){
						b=1;
						if(a==1);
							a++;
					}
				}
		</script>
	</body>
</html>
